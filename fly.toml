# Deploy: fly launch --no-deploy (first time, to link an app name/region),
# then set secrets and deploy:
#
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32) USER1_PASSWORD=... USER2_PASSWORD=...
#   fly volumes create pairchat_data --size 1
#   fly deploy

app = "pairchat"
primary_region = "iad"

[build]

[env]
  PORT = "4000"
  CLIENT_ORIGIN = "https://pairchat.fly.dev"
  DB_PATH = "/app/backend/data/pairchat.db"
  USER1_NAME = "Alex"
  USER2_NAME = "Sam"

[mounts]
  source = "pairchat_data"
  destination = "/app/backend/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
