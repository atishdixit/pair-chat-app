services:
  pairchat:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # Same origin serves the frontend and API in this build, so this only
      # matters if you point a separately-hosted frontend at this container.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml}
      DB_PATH: /app/backend/data/pairchat.db
      USER1_NAME: ${USER1_NAME:-Alex}
      USER1_PASSWORD: ${USER1_PASSWORD:?Set USER1_PASSWORD in a .env file}
      USER2_NAME: ${USER2_NAME:-Sam}
      USER2_PASSWORD: ${USER2_PASSWORD:?Set USER2_PASSWORD in a .env file}
    volumes:
      - pairchat-data:/app/backend/data
    restart: unless-stopped

volumes:
  pairchat-data:
